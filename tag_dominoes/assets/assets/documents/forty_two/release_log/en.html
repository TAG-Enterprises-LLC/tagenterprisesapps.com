<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Release Log</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #f6f1e4;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    .tag-policy-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero,
    .card {
      display: block;
      width: auto;
      margin: 0 0 14px 0;
      padding: 14px;
      border: 1px solid #d6a633;
      border-radius: 12px;
      background: #ffffff;
    }

    .hero {
      background: #063a25;
      color: #ffffff;
    }

    .badge {
      display: none;
    }

    h1,
    h2,
    h3 {
      margin: 0 0 10px 0;
      color: #063a25;
    }

    .hero h1,
    .hero h2 {
      color: #ffd966;
    }

    p {
      margin: 0 0 10px 0;
    }

    ul {
      margin: 0 0 10px 22px;
      padding: 0;
    }

    li {
      margin-bottom: 5px;
    }

    a {
      color: #0b63ce;
      word-break: break-word;
    }

    .contact-email {
      font-size: 15px;
    }

    .footer {
      text-align: center;
      color: #ffffff;
      background: #063a25;
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="tag-policy-page">

    <section class="hero">
      <h1>T-G-Apps LLC</h1>
      <h2>Release Log</h2>
      <p class="subtitle">T-G-Apps Dominoes 42</p>
    </section>

    <section class="card accent">
      <h3>Version 1.0.0</h3>
      <ul><li>New 42 setup screen with rules, audio and player options.</li><li>Playable four-player Texas 42 with human and robot players.</li><li>Game history, About, Privacy, How to Play and Hint screens.</li></ul>
    </section>

    <p class="footer">&copy; 2026 T-G-Apps LLC. All rights reserved.</p>

  </div>
</body>
</html>
