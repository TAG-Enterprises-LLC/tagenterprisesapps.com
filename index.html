```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAG Enterprises LLC</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .click-area {
      position: absolute;
      cursor: pointer;
      background: rgba(255, 255, 255, 0);
    }

    /* TAG_21 */
    #tag21 {
      left: 10%;
      top: 27%;
      width: 35%;
      height: 10%;
    }

    /* TAG-YZ */
    #tagyz {
      left: 10%;
      top: 41%;
      width: 35%;
      height: 10%;
    }

    /* Privacy */
    #privacy {
      right: 4%;
      bottom: 4%;
      width: 16%;
      height: 7%;
    }

    /* Music Toggle */
    #music {
      right: 4%;
      bottom: 14%;
      width: 16%;
      height: 7%;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Main Background -->
  <img
    src="main_web.png"
    alt="TAG Enterprises"
    class="background"
  />

  <!-- Invisible Click Areas -->
  <div
    id="tag21"
    class="click-area"
    onclick="openTag21()">
  </div>

  <div
    id="tagyz"
    class="click-area"
    onclick="openTagYZ()">
  </div>

  <div
    id="privacy"
    class="click-area"
    onclick="openPrivacy()">
  </div>

  <div
    id="music"
    class="click-area"
    onclick="toggleMusic()">
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="bg_track_1.mp3" type="audio/mpeg">
  </audio>

  <script>
    let musicStarted = false;
    let musicEnabled = false;

    function ensureMusicStarted() {
      const music = document.getElementById('bgMusic');

      if (!musicStarted) {
        music.volume = 0.4;

        music.play()
          .then(() => {
            musicStarted = true;
            musicEnabled = true;
          })
          .catch(() => {
            console.log('Autoplay blocked until user interaction.');
          });
      }
    }

    function toggleMusic() {
      const music = document.getElementById('bgMusic');

      if (!musicStarted) {
        ensureMusicStarted();
        return;
      }

      if (music.paused) {
        music.play();
        musicEnabled = true;
      } else {
        music.pause();
        musicEnabled = false;
      }
    }

    function openPrivacy() {
      window.location.href = 'tag_policy.html';
    }

    function openTag21() {
      alert('TAG_21 web version coming soon.');
    }

    function openTagYZ() {
      alert('TAG-YZ web version coming soon.');
    }

    document.body.addEventListener(
      'click',
      ensureMusicStarted,
      { once: true }
    );
  </script>

</body>
</html>
