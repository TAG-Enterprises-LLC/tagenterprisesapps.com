<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/tag_yz/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="T-G-Apps YZ, a dice scorecard strategy game from T-G-Apps LLC.">
  <link rel="stylesheet" href="../packages/device-display-optimizer/device-display-optimizer.css">
  <script src="../packages/device-display-optimizer/device-display-optimizer.js"></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="T-G-Apps YZ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>T-G-Apps YZ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (() => {
      const stampedBuildId = '20260809T160221Z-4a5a7cc2338a';
      const buildId = stampedBuildId.startsWith('__TAG_YZ_')
        ? `development-${Date.now()}`
        : stampedBuildId;
      const cleanupKey = `tag-yz-worker-cleanup-${buildId}`;
      let bootstrapStarted = false;

      window.tagYzBuildId = buildId;

      function loadBootstrap() {
        if (bootstrapStarted) return;
        bootstrapStarted = true;

        const script = document.createElement('script');
        script.src = `flutter_bootstrap.js?v=${encodeURIComponent(buildId)}`;
        script.defer = true;
        document.body.appendChild(script);
      }

      async function removeLegacyServiceWorkers() {
        if (!('serviceWorker' in navigator)) return false;

        const appPath = new URL(document.baseURI).pathname;
        const registrations = await navigator.serviceWorker.getRegistrations();
        const appRegistrations = registrations.filter((registration) => {
          try {
            return new URL(registration.scope).pathname.startsWith(appPath);
          } catch (_) {
            return false;
          }
        });
        const hadController = navigator.serviceWorker.controller != null;
        const results = await Promise.all(
          appRegistrations.map((registration) => registration.unregister()),
        );
        return hadController || results.some(Boolean);
      }

      function showUpdateBanner(newBuildId) {
        if (document.getElementById('tag-yz-update-banner')) return;

        const banner = document.createElement('div');
        banner.id = 'tag-yz-update-banner';
        banner.style.cssText = [
          'position:fixed',
          'left:12px',
          'right:12px',
          'top:12px',
          'z-index:2147483647',
          'display:flex',
          'align-items:center',
          'justify-content:center',
          'gap:12px',
          'padding:12px 16px',
          'border:2px solid #ffd700',
          'border-radius:10px',
          'background:#092719',
          'color:#fff',
          'font:700 15px Arial,sans-serif',
          'box-shadow:0 4px 18px rgba(0,0,0,.55)',
        ].join(';');

        const message = document.createElement('span');
        message.textContent = 'A new T-G-Apps YZ version is available.';

        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Reload';
        button.style.cssText = [
          'border:0',
          'border-radius:7px',
          'padding:8px 14px',
          'background:#ffd700',
          'color:#111',
          'font-weight:800',
          'cursor:pointer',
        ].join(';');
        button.addEventListener('click', () => {
          const url = new URL(window.location.href);
          url.searchParams.set('v', newBuildId);
          window.location.replace(url.toString());
        });

        banner.append(message, button);
        document.body.appendChild(banner);
      }

      function startVersionChecks() {
        async function checkVersion() {
          try {
            const response = await fetch(
              `tag_yz_build.json?check=${Date.now()}`,
              { cache: 'no-store' },
            );
            if (!response.ok) return;

            const metadata = await response.json();
            if (metadata.buildId && metadata.buildId !== buildId) {
              showUpdateBanner(metadata.buildId);
            }
          } catch (_) {
            // A temporary network failure must not prevent the game loading.
          }
        }

        window.setInterval(checkVersion, 5 * 60 * 1000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            checkVersion();
          }
        });
        checkVersion();
      }

      async function start() {
        const removedWorker = await removeLegacyServiceWorkers();
        if (removedWorker && sessionStorage.getItem(cleanupKey) !== buildId) {
          sessionStorage.setItem(cleanupKey, buildId);
          window.location.reload();
          return;
        }

        sessionStorage.removeItem(cleanupKey);
        loadBootstrap();
        startVersionChecks();
      }

      start().catch((error) => {
        console.warn('T-G-Apps YZ web startup cleanup failed:', error);
        loadBootstrap();
        startVersionChecks();
      });
    })();
  </script>
</body>
</html>
