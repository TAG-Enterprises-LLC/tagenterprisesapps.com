<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Play TAG_YZ</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050b12;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-shell {
      width: min(430px, 100vw);
      height: min(932px, 100vh);
      aspect-ratio: 9 / 19.5;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 28px rgba(0,0,0,0.75);
    }

    .phone-shell iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    @media (max-height: 932px) {
      .phone-shell {
        height: 100vh;
        width: calc(100vh * 9 / 19.5);
      }
    }

    @media (max-width: 430px) {
      .phone-shell {
        width: 100vw;
        height: calc(100vw * 19.5 / 9);
      }
    }
  </style>
</head>

<body>
  <div class="phone-shell">
    <iframe
      src="tag_yz/"
      allow="autoplay; fullscreen"
    ></iframe>
  </div>
</body>
</html>
